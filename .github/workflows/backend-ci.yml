name: Backend CI

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main, arena/*]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres@localhost:5432/empire_test
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base-do-not-use-in-production
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: test-primary-key-1234
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: test-deterministic-key-1234
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: test-salt-1234

    steps:
      - uses: actions/checkout@v4

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-tools

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Precompile assets
        run: bin/rake assets:precompile

      - name: Run tests
        run: bundle exec rspec

      - name: Brakeman security scan
        run: bundle exec brakeman --no-pager -q

      - name: Bundle audit
        run: bundle exec bundle-audit check --update
