name: Backend CI
on:
  push:
    branches: [main, 'arena/*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  # The schema drift step posts the exact diff a developer must commit. Without
  # it the only copy is in the job log, which is awkward to reach from a phone or
  # from a tool that cannot stream runner logs.
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s
          --health-timeout=5s --health-retries=12
    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_USERNAME: postgres
      DATABASE_NAME_TEST: empire_test
      SECRET_KEY_BASE: ci-only-secret-key-base-0123456789abcdef0123456789abcdef
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ci-only-primary-key-0123456789abcdef
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ci-only-deterministic-key-0123456789abcdef
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ci-only-salt-0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: admin@empire.test
      ADMIN_PASSWORD: DemoAdmin123!
      EMPIRE_SEED_DEMO: 'true'
      SPREE_PUBLISHABLE_KEY: pk_empire_ci_publishable_0123456789
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-tools
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          working-directory: server
          bundler-cache: true
      - name: Locked dependency check
        run: bash ../scripts/ci-run.sh bundle check
      - name: Create database and run every migration
        run: bash ../scripts/ci-run.sh bin/rails db:create db:migrate
      - name: Migration status
        run: bash ../scripts/ci-run.sh bin/rails db:migrate:status
      - name: schema.rb must match the migrations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bin/rails db:schema:dump
          if git diff --quiet -- db/schema.rb; then
            echo "db/schema.rb matches the migrations."
            exit 0
          fi

          git --no-pager diff -- db/schema.rb
          DIFF="$(git --no-pager diff -- db/schema.rb)"

          # Find the pull request this run belongs to. On a pull_request event
          # the number is in the payload; on a push to an arena/* branch it has
          # to be looked up from the head SHA.
          PR=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR="${{ github.event.pull_request.number }}"
          else
            PR="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "${{ github.api_url }}/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              | jq -r '[.[] | select(.state == "open")][0].number // empty' || true)"
          fi

          if [ -n "$PR" ]; then
            MARKER="<!-- empire-schema-drift -->"
            # Comment bodies are capped at 65536 characters; a schema.rb this
            # size could exceed that if the drift were ever large.
            if [ "${#DIFF}" -gt 50000 ]; then
              DIFF="${DIFF:0:50000}
              ... truncated by CI: the full diff is in the job log."
            fi
            BODY="$(jq -rn --arg marker "$MARKER" --arg diff "$DIFF" --arg sha "${{ github.sha }}" '
              $marker + "\n## db/schema.rb does not match the migrations\n\n" +
              "`bin/rails db:schema:dump` produced this diff against the committed file at `" + $sha[0:7] + "`. " +
              "Commit it so `db:schema:load` and `db:prepare` build the same database as `db:migrate`.\n\n" +
              "```diff\n" + $diff + "\n```\n"')"

            # Reuse one comment per PR rather than adding a new one on every
            # force-push, so the thread stays readable.
            EXISTING="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "${{ github.api_url }}/repos/${{ github.repository }}/issues/$PR/comments?per_page=100" \
              | jq -r --arg marker "$MARKER" '[.[] | select(.body | startswith($marker))][0].id // empty' || true)"

            if [ -n "$EXISTING" ]; then
              jq -n --arg body "$BODY" '{body: $body}' \
                | curl -fsSL -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    -d @- "${{ github.api_url }}/repos/${{ github.repository }}/issues/comments/$EXISTING" >/dev/null
            else
              jq -n --arg body "$BODY" '{body: $body}' \
                | curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    -d @- "${{ github.api_url }}/repos/${{ github.repository }}/issues/$PR/comments" >/dev/null
            fi
            echo "Posted the schema diff to PR #$PR."
          fi

          echo "::error title=db/schema.rb is stale::Migrations were added without re-dumping schema.rb. The diff is printed in this log and, if this run belongs to a pull request, posted as a PR comment."
          exit 1
      - name: Seed reference and demo data
        run: bash ../scripts/ci-run.sh bin/rails db:seed
      - name: Verify seed idempotence
        run: bash ../scripts/ci-run.sh bin/rails db:seed
      - name: Runtime boot and Empire extension proof
        run: |
          bash ../scripts/ci-run.sh bin/rails runner 'puts({ruby: RUBY_VERSION, rails: Rails.version, spree: Spree.version, database: ActiveRecord::Base.connection.select_value("SELECT current_database()"), provinces: Empire::Province.count, cod: Empire::CashOnDelivery.count, routes: Rails.application.routes.routes.size}.to_json)'
      - name: RSpec
        run: |
          set -euo pipefail
          bundle exec rspec --format progress --format RspecJunitFormatter --out tmp/rspec.xml 2>&1 | tee tmp/rspec.log
      - name: Surface RSpec failure details
        if: failure()
        run: node ../scripts/annotate-log.mjs tmp/rspec.log "RSpec failed"
      - name: Surface RSpec failure head
        if: failure()
        run: |
          node -e "const fs=require('fs');const p='tmp/rspec.log';if(fs.existsSync(p)){const s=fs.readFileSync(p,'utf8').slice(0,3300);console.log('::error title=RSpec failed (head)::'+s.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A'))}"
      - name: Brakeman (warnings fail the job)
        run: bash ../scripts/ci-run.sh bundle exec brakeman --no-pager -q
      - name: Bundle Audit (advisories fail the job)
        run: bash ../scripts/ci-run.sh bundle exec bundle-audit check --update
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: |
            server/tmp/rspec.xml
            server/tmp/rspec.log
            server/log/test.log
          if-no-files-found: warn
