name: Frontend CI
on:
  push:
    branches: [main, 'arena/*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: storefront
    env:
      NEXT_PUBLIC_SPREE_PUBLISHABLE_KEY: pk_empire_ci_publishable_0123456789
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Translation, dependency and API static audit
        run: bash ../scripts/ci-run.sh node ../scripts/audit-static.mjs
      - name: TypeScript
        run: bash ../scripts/ci-run.sh npx tsc --noEmit
      - name: Lint
        run: bash ../scripts/ci-run.sh npm run lint
      - name: Production build
        run: bash ../scripts/ci-run.sh npm run build
  dashboards:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: dashboard
            base: /dashboard/
          - app: seller-dashboard
            base: /sellers/
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Install locked dependencies
        run: bash ../../scripts/ci-run.sh corepack pnpm install --frozen-lockfile
      - name: TypeScript
        run: bash ../../scripts/ci-run.sh corepack pnpm typecheck
      - name: Lint
        run: bash ../../scripts/ci-run.sh corepack pnpm lint
      - name: Real contract tests
        run: bash ../../scripts/ci-run.sh corepack pnpm test
      - name: Production build
        run: bash ../../scripts/ci-run.sh corepack pnpm build
        env:
          VITE_BASE_PATH: ${{ matrix.base }}
