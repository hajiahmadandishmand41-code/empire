# Deployable production-shaped stack. Build the application's own image;
# never substitute ghcr.io/spree/spree (it does not contain Empire's code).
name: empire
x-backend: &backend
  build:
    context: .
    dockerfile: server/Dockerfile
    target: final
  image: empire-backend:${EMPIRE_IMAGE_TAG:-local}
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    RAILS_ENV: production
    DATABASE_URL: postgresql://empire:${POSTGRES_PASSWORD:?run npm run env:bootstrap}@postgres:5432/empire_production
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?run npm run env:bootstrap}
    ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:?missing encryption key}
    ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:?missing encryption key}
    ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:?missing encryption salt}
    RAILS_FORCE_SSL: ${RAILS_FORCE_SSL:-true}
    RAILS_ASSUME_SSL: ${RAILS_ASSUME_SSL:-true}
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
    SPREE_HOST: ${SPREE_HOST:-localhost:3000}
    SOLID_QUEUE_IN_PUMA: "true"
    JOB_THREADS: ${JOB_THREADS:-3}
    STORE_COUNTRY: AF
    STORE_LOCALE: fa-AF
    STORE_CURRENCY: AFN
    SPREE_PUBLISHABLE_KEY: ${SPREE_PUBLISHABLE_KEY:?run npm run env:bootstrap}
    EMPIRE_SEED_DEMO: "false"
    ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    MISSION_CONTROL_USER: ${MISSION_CONTROL_USER:-}
    MISSION_CONTROL_PASSWORD: ${MISSION_CONTROL_PASSWORD:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: empire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run npm run env:bootstrap}
      POSTGRES_DB: empire_production
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "bin/rails db:prepare && echo EMPIRE_PREPARED && bin/rails db:seed && echo EMPIRE_SEEDED"]

  web:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${SPREE_PORT:-3000}:3000"
    volumes:
      - storage_data:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  storefront:
    build:
      context: ./storefront
      args:
        NEXT_PUBLIC_SPREE_PUBLISHABLE_KEY: ${SPREE_PUBLISHABLE_KEY:?run npm run env:bootstrap}
    environment:
      API_INTERNAL_URL: http://web:3000
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${STOREFRONT_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
